name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir build-src
          unzip -q StudyPlannerAndroid.zip -d build-src

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find build-src -name 'build.gradle' -o -name 'build.gradle.kts' | head -n 1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java/Kotlin JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -name "build.gradle" -type f -exec sed -i \
            -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/jvmTarget = ["'\'']1.8["'\'']/jvmTarget = "17"/g' \
            {} \;

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: '**/build/outputs/apk/debug/*.apk'
